services:
  - type: web
    name: tilahun-site-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BOT_TOKEN
        sync: false
      - key: SUPERGROUP_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: REQUIRE_APPROVAL
        value: "True"
      - key: TIMEZONE
        value: "Africa/Addis_Ababa"
      - key: GOOGLE_SHEET_WEBHOOK_URL
        sync: false
